name: Android app

# Builds the Palate APK and publishes it as a GitHub release ("Download for Android" on the site).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install --fix -- --legacy-peer-deps

      - name: Check the app bundles
        run: npx expo export --platform android --output-dir /tmp/bundle-check

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk palate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: palate-apk
          path: mobile/palate.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Palate test build ${{ github.run_number }}
          body: "Test build from ${{ github.sha }}. Install palate.apk on an Android phone."
          files: mobile/palate.apk
          make_latest: true
