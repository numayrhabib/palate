name: Website

# Publishes the download page, the admin dashboard and a browser preview of the app to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the browser preview of the app
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install --fix -- --legacy-peer-deps
          npx expo export --platform web

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r mobile/dist _site/preview
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
